name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact_name: kit
            asset_name: kit-macos-amd64
            strip_command: strip
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact_name: kit
            asset_name: kit-macos-arm64
            strip_command: strip
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact_name: kit
            asset_name: kit-linux-amd64
            strip_command: strip
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact_name: kit
            asset_name: kit-linux-arm64
            strip_command: aarch64-linux-gnu-strip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: ${{ matrix.strip_command }} target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          mkdir release-assets
          for artifact in artifacts/*; do
            asset_name="$(basename "$artifact")"
            mv "$artifact/kit" "release-assets/$asset_name"
          done
          rm -rf artifacts
          mv release-assets artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
